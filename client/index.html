<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      property="og:title"
      content="Byaan - Local-First Data Analysis Tool"
    />
    <meta
      property="og:description"
      content="Privacy-first database analysis tool. Analyze data securely on your local machine."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://byaan-web.pages.dev" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Byaan - Local-First Data Analysis Tool"
    />
    <meta
      name="twitter:description"
      content="Privacy-first database analysis tool. Analyze data securely on your local machine."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/config.js"></script>
    <title>Byaan</title>
    <style>
      /* Global loading overlay for tenant switching */
      #tenant-switching-overlay {
        position: fixed;
        inset: 0;
        background-color: #0d0d0d;
        z-index: 99999;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #tenant-switching-overlay.active {
        display: flex;
      }
      .spinner {
        width: 64px;
        height: 64px;
        border: 4px solid #1f1f1f;
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .switching-text {
        color: white;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 24px;
        font-weight: 600;
        margin-top: 24px;
      }
      .switching-subtext {
        color: #9ca3af;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <!-- Global loading overlay -->
    <div id="tenant-switching-overlay">
      <div style="text-align: center;">
        <div class="spinner"></div>
        <div class="switching-text">Switching workspace...</div>
        <div class="switching-subtext">Please wait</div>
      </div>
    </div>

    <div id="root"></div>

    <!-- Check for switching flag and show overlay immediately -->
    <script>
      if (localStorage.getItem('byaan_switching_tenant') === 'true') {
        document.getElementById('tenant-switching-overlay').classList.add('active');
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
