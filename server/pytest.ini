[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    notebook: marks tests as notebook-related
    connection: marks tests as connection-related
    workflow: marks tests as workflow integration tests
    error_handling: marks tests as error handling tests